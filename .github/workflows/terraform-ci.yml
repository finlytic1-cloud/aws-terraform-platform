name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: fmt / validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [bootstrap, environments/dev]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend, no credentials needed)
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false -input=false

      - name: Validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate

  lint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4

      - name: Init tflint
        run: tflint --init

      - name: Run tflint
        run: tflint --recursive

  security:
    name: checkov (security scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: true # report findings without failing the build; tighten later
